<!DOCTYPE html>
<html>

<head>
    <title>Excercises</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ProductDetails({ name, price, discountPrice, imgSrc }) {
            return (
                <div>
                    <img src={imgSrc} width="50" />
                    <p>{name}</p>
                    {
                        discountPrice ? (
                            <>
                                <p><del>Price: ${price.toFixed(2)}</del></p>
                                <p>Discount price :${discountPrice.toFixed(2)}</p>
                            </>
                        ) : (
                            <p>Price: ${price.toFixed(2)}</p>
                        )
                    }

                    <button>Add to Cart</button>
                </div>

            );
        }
        function App() {
            return (
                <>

                    <ProductDetails
                        imgSrc="images\cotton-socks.png"
                        name="Cotton Socks"
                        price={10.90}
                        discountPrice={5.45}
                    />
                    <ProductDetails
                        imgSrc="images\tennis-balls.png"
                        name="Tennis balls"
                        price={6.00}
                    />
                    <ProductDetails
                        imgSrc="images\plain-t-shirt.png"
                        name="T_Shirt"
                        price={7.99}
                    />

                </>
            );
        }
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);

    </script>
</body>

</html>
