<!DOCTYPE html>
<html>

<head>
    <title>Excercises</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function Input({ text, setText }) {
            function handleChange(event) {
                setText(event.target.value);


            }
            return (
                <>
                    <input placeholder="Type a name  here..." onChange={handleChange} value={text} />
                </>
            );
        }
        function Reset({ setText }) {
            function handleReset() {
                setText('');

            }

            return (
                <>
                    <button onClick={handleReset}>Reset</button>

                </>
            );
        }
        function Example({ setText }) {
            function handleReset() {
                setText('Lama');

            }

            return (
                <>
                    <button onClick={handleReset}>Example</button>

                </>
            );
        }

        function App() {
            const [text, setText] = React.useState('');
            return (
                <>
                    <Input text={text} setText={setText} />
                    <Reset setText={setText}></Reset>
                    <Example setText={setText}></Example>
                    <p>Hello {text}</p>


                </>
            );

        }
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);

    </script>
</body>

</html>
