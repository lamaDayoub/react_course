<!DOCTYPE html>
<html>

<head>
    <title>Excercises</title>
    <style>
        body {
            font-family: Arial;
        }

        .email-input,
        .password-input {
            padding: 5px 13px;
            margin-bottom: 10px;
            margin-right: 15px;
        }

        p {
            font-size: 20px;
            font-style: bold;
        }

        .login-button,
        .signup-button {
            background-color: rgb(0, 123, 255);
            color: white;
            margin-right: 10px;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function LoginForm() {
            const [isHidden, setIshidden] = React.useState(true);
            function handleClick() {
                setIshidden(!isHidden);
            }

            return (
                <>
                    <div>
                        <input placeholder="Email" className="email-input" />
                    </div>
                    <div>
                        <input placeholder="Password" className="password-input" type={isHidden ? "password" : "text"} />
                        <button className="show-hide-button" onClick={handleClick}>{isHidden ? "show" : "hide"}</button>
                    </div>
                    <button className="login-button">Login</button>
                    <button className="signup-button">Sign up</button>

                </>
            );
        }
        function App() {
            return (
                <>
                    <p>Hello, Welcome to my website</p>
                    <LoginForm />
                </>
            );
        }
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);

    </script>
</body>

</html>
